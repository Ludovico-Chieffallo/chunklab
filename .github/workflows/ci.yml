name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when the same ref is pushed again: stale runs
# waste minutes and can report after the newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest

  # The test job runs from the checkout. This one builds the wheel and uses it from a
  # clean virtualenv, so a module missing from the package fails the pull request
  # that drops it instead of the release that ships it - 0.4.0 shipped a
  # `chunklab demo` that could not start, with every test green.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: |
          pip install 'build>=1.6,<2'
          python -m build --wheel
      - name: Install it in a clean virtualenv and use it
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python scripts/smoke_test_wheel.py dist/*.whl --expect-version "$version"
