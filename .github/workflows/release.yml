name: Release

on:
  push:
    tags: ["v*"]

# Serialized, never cancelled: aborting a run mid-publish could leave a
# half-uploaded release on PyPI, which cannot be re-uploaded under the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything below publishes whatever this tag points at, on a version number PyPI
  # never lets you reuse. So before building: the tag must name the version the
  # package reports, the commit must already be on main (and so have passed the
  # protected CI), and the gate is run once more on exactly this commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: The tag matches the package version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint, format, test
        run: |
          ruff check .
          ruff format --check .
          pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to major ranges, for the same reason ruff is pinned in
      # pyproject.toml: an unpinned gate depends on whatever two third-party
      # tools released this morning. The coupling here is real and was hit
      # while preparing 0.4.0 — hatchling writes `Metadata-Version: 2.5`, which
      # twine 6.2 rejects outright and twine 7 accepts. Unpinned, the day
      # hatchling outruns twine the break lands *during* a publish, on a
      # version number that can never be reused.
      - name: Build sdist and wheel
        run: |
          pip install 'build>=1.6,<2' 'twine>=7.0,<8'
          python -m build
          twine check dist/*
      # The suite runs from the checkout, so it never saw that the 0.4.0 wheel had
      # no module for `chunklab demo` to import. This installs the wheel that is
      # about to be published into a clean virtualenv and uses it from outside the
      # repository. CPU-only torch keeps that install small; nothing here needs a GPU.
      - name: Install the wheel in a clean virtualenv and use it
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python scripts/smoke_test_wheel.py dist/*.whl --expect-version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    # Pre-releases (e.g. v0.2.0rc1) go to TestPyPI.
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC trusted publishing - no API tokens stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Stable tags (e.g. v0.2.0) go to PyPI.
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing - no API tokens stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
