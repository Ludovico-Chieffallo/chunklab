name: docs

# Publishes on every push to main that touches the docs. Pull requests only build,
# so a broken link fails review rather than the live site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Supersede an in-flight run when the same ref is pushed again: stale runs
# waste minutes and can report after the newer one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocs<2 pinned: the Material team warns MkDocs 2.0 is currently
      # unlicensed and removes the plugin system entirely.
      - run: pip install "mkdocs<2" mkdocs-material
      - name: Build the site (strict - broken links fail)
        run: mkdocs build --strict

  deploy:
    # Never from a pull request: a fork could otherwise publish to the live site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocs<2 pinned: the Material team warns MkDocs 2.0 is currently
      # unlicensed and removes the plugin system entirely.
      - run: pip install "mkdocs<2" mkdocs-material
      - run: mkdocs gh-deploy --force
