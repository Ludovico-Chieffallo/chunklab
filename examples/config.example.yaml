embedding:
  backend: local                 # local | openai
  model: BAAI/bge-small-en-v1.5

retrieval:
  mode: dense                    # dense | bm25 | hybrid   (bm25/hybrid = fast-follow)
  top_k: 5

eval:
  fuzzy_threshold: 0.90
  ranking_metric: balanced       # balanced (default) | recall_at_k | mrr | hit_rate_at_k
  balanced_lambda: 0.05          # context-cost penalty; see docs/metrics.md
  seed: 0                        # bootstrap RNG seed
  min_floor_tokens: 200

strategies:
  - name: fixed
    params: { chunk_size: 512, overlap: 64 }
  - name: recursive
    params: { chunk_size: 512, overlap: 64 }
  - name: semantic
    params: { breakpoint_percentile: 95, min_tokens: 200, max_tokens: 1000 }
  - name: semantic_no_floor      # included on purpose to demonstrate the fragment trap
    params: { breakpoint_percentile: 95, min_tokens: 0, max_tokens: 1000 }
  - name: structure
    params: { max_tokens: 800 }

output:
  formats: [console, html, json]
  dir: ./chunklab_report
