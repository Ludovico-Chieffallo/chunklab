questions:
- id: faq_spending_limit
  query: What happens when my monthly budget hard cap is reached?
  gold_snippets:
  - new resource creation is rejected immediately and running compute instances are paused, while stored
    data, snapshots, and reserved addresses are preserved untouched. The cap resets at midnight UTC on
    the first day of the month, and a webhook can notify your own systems at fifty, eighty, and one hundred
    percent of the budget.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_card_declined_tail
  query: How long after the grace period does compute get stopped for unpaid accounts?
  gold_snippets:
  - After three consecutive failed charges the account enters a seven-day grace period; during grace the
    console shows a red banner but nothing is suspended. If the seventh day passes without a successful
    charge, new resource creation is blocked first, and running compute is stopped forty-eight hours later
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_jit_access
  query: How long can a temporary elevated permission last?
  gold_snippets:
  - bounded window between fifteen minutes and eight hours, with a mandatory reason field. Approval comes
    from any organization owner other than the requester, and the elevation expires automatically without
    any action from either side.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_mfa_sms
  query: Why is SMS not available as a second factor?
  gold_snippets:
  - SMS is deliberately not offered as a second factor because of SIM-swap risk
  tags:
  - short_answer
  - faq
  - src:faq_support
- id: faq_vm_sla
  query: What availability SLA does a single virtual machine have?
  gold_snippets:
  - A single instance carries a 99.5 percent monthly availability SLA, while an instance group spread
    across two availability zones carries 99.95 percent. SLA credits are ten percent of the monthly fee
    for the affected resources per breached tier, requested through a ticket within thirty days of the
    incident with the affected instance ids.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_multi_attach
  query: Can I attach one volume to several instances at the same time?
  gold_snippets:
  - 'Multi-attach is supported only on the ultra tier and must be enabled at volume creation; it cannot
    be toggled later. The platform provides no locking: a cluster-aware filesystem or an application-level
    protocol such as a database''s shared-disk mode is the customer''s responsibility.'
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_volume_shrink
  query: Is it possible to shrink a block volume?
  gold_snippets:
  - Volumes can only grow online; shrinking is not supported
  tags:
  - short_answer
  - faq
  - src:faq_support
- id: faq_key_revocation
  query: What happens to volumes if I revoke their customer-managed key?
  gold_snippets:
  - key revocation renders all dependent volumes unreadable within one hour
  tags:
  - short_answer
  - faq
  - src:faq_support
- id: faq_rate_limit
  query: How many requests per second can a bucket prefix handle?
  gold_snippets:
  - 3,500 write and 5,500 read requests per second per key prefix, and throughput scales linearly by spreading
    keys across prefixes. Sequential, timestamp-leading key names funnel all traffic into one prefix and
    are the most common cause of throttling in ingestion pipelines.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_same_subnet
  query: Two instances in the same subnet cannot reach each other — what is the usual cause?
  gold_snippets:
  - Rules can reference other security groups instead of IP ranges, which keeps policies valid as instances
    come and go. The most frequent misconfiguration is a group that opens ports to external ranges but
    not to its own group id
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_byoip
  query: What are the requirements to bring my own IP range?
  gold_snippets:
  - provider-independent IPv4 blocks of /24 or larger, with a signed letter of authorization from the
    range holder. Announcement propagation takes up to two business days, during which the range stays
    usable at its previous location.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_dns_failover
  query: How quickly does DNS failover switch to the secondary record?
  gold_snippets:
  - a secondary record takes over within thirty seconds of failure. Record propagation inside the platform's
    resolvers is near-instant, while public propagation depends on the record TTL, with sixty seconds
    as the practical minimum.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_scale_zero
  query: How long does a node pool take to scale up from zero?
  gold_snippets:
  - Scale-up from zero takes about ninety seconds
  tags:
  - short_answer
  - faq
  - src:faq_support
- id: faq_autoscaler_removal
  query: When does the cluster autoscaler consider removing a node?
  gold_snippets:
  - requested utilization stays below fifty percent for ten minutes and every pod on it can be rescheduled
    elsewhere without violating disruption budgets, affinity rules, or local storage constraints. Nodes
    annotated as no-scale-down are never touched, which protects singleton workloads that tolerate no
    eviction.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_db_replicas
  query: How many read replicas can a managed database have?
  gold_snippets:
  - Up to five asynchronous read replicas are supported, including cross-region replicas for read locality
    and disaster recovery. Replication lag is exported as a first-class metric, and a replica can be promoted
    to a standalone primary in under a minute, which is the documented regional-failover path.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_fn_retries
  query: Are failed function invocations retried?
  gold_snippets:
  - asynchronous invocations are retried twice with exponential backoff. After the final failure the event
    goes to the project's dead-letter queue if one is configured, with the full payload and the error
    chain attached.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_audit_retention
  query: How long are audit logs kept?
  gold_snippets:
  - immutable and retained for 400 days. A streaming export can copy audit records to a bucket or an external
    SIEM within one minute of the event, and the export itself is recorded in the trail.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_immutability_cooling
  query: Can an attacker with owner credentials disable backup immutability instantly?
  gold_snippets:
  - Lock changes take effect after a seventy-two-hour cooling period announced to all owners, which defeats
    smash-and-grab credential abuse. Restore operations remain instant and unrestricted, so the lock protects
    the data without slowing recovery.
  tags:
  - short_answer
  - faq
  - two_sentence
  - src:faq_support
- id: faq_pentest
  query: Do I need approval before running a penetration test?
  gold_snippets:
  - denial-of-service scenarios, which always require a scheduled engagement
  tags:
  - short_answer
  - faq
  - src:faq_support
- id: faq_escalation
  query: What happens when I escalate a stalled support ticket?
  gold_snippets:
