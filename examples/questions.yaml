- id: faq_k8s_hooks
  query: Can my database flush to disk before a snapshot is taken?
  gold_snippets:
  - Pre- and post-backup hooks run inside annotated pods, letting databases flush and quiesce before the
    volume snapshot is taken. Hook failures mark the backup point as crash-consistent-only rather than
