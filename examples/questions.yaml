  - src:faq_support
- id: faq_stale_keys
  query: How do I find credentials that nobody uses anymore?
  gold_snippets:
  - keys older than ninety days are flagged on the credentials hygiene page, and an organization policy
    can force-expire them. Each key shows its last-used timestamp and source IP, which makes abandoned
    keys easy to distinguish from quiet-but-alive ones.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_session_length
  query: When do signed-in users get logged out automatically?
  gold_snippets:
  - Interactive console sessions expire after twelve hours, or after thirty minutes of inactivity when
    the idle-timeout policy is enabled. Re-authentication always requires the second factor in MFA-enforcing
    organizations, and active sessions can be revoked centrally per member.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_serial_console
  query: How can I recover access to a machine that dropped off the network?
  gold_snippets:
  - SSH tunnel using a short-lived token valid for five minutes
  tags:
  - short_answer
  - faq
  - tail
  - src:faq_support
- id: faq_live_migration_pause
  query: Will my latency-sensitive service notice host maintenance?
  gold_snippets:
  - pauses the guest for under one second while dirty memory pages converge. Latency-sensitive workloads
    can subscribe to migration events and receive a sixty-second pre-notification to shed traffic before
    the pause.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_burst
  query: Can disk performance temporarily exceed the provisioned baseline?
  gold_snippets:
  - sustain 3,000 IOPS for up to thirty minutes. The remaining burst balance is exported as a metric,
    so exhaustion is predictable rather than a surprise slowdown.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_object_lock
  query: Can stored records be made undeletable to satisfy regulators?
  gold_snippets:
  - compliance mode prevents deletion or overwrite of a version
  tags:
  - short_answer
  - faq
  - tail
  - src:faq_support
- id: faq_inventory
  query: How do I list everything we store for an external audit?
  gold_snippets:
  - Daily inventory reports list every object with size, storage class, encryption status, and checksum,
    delivered to a destination bucket as compressed CSV or Parquet. Inventories are the recommended input
    for large-scale audits instead of paginated listing calls.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_flow_logs
  query: Where can I see connections that were dropped before reaching my servers?
  gold_snippets:
  - Flow logs record accepted and rejected flows per network interface with one-minute aggregation and
    land in the logging service or a bucket. Sampling is full by default, and a per-subnet setting can
    reduce it to one in ten for very chatty fabrics.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
- id: faq_mtu
  query: Do jumbo frames work between my machines?
  gold_snippets:
  - jumbo frames up to 8950 bytes, negotiated automatically by the maintained images. Traffic leaving
    the region is clamped to 1500, and the platform rewrites MSS on egress paths so misconfigured guests
    avoid silent fragmentation.
  tags:
  - short_answer
  - faq
  - tail
  - two_sentence
  - src:faq_support
