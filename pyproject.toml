[build-system]
# Upper-bounded deliberately: hatchling decides the `Metadata-Version` the wheel
# carries, and twine has to be new enough to read it. Pinning twine in
# release.yml only covers one end of that pair — a hatchling major that emits a
# newer metadata version would break the publish from the other side, on a
# version number PyPI never lets you reuse.
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "chunklab"
version = "0.4.1"
description = "Tells you whether the difference between chunking strategies is real - on your own documents - before you commit to one."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ludovico Chieffallo" }]
keywords = ["rag", "chunking", "retrieval", "evaluation", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "langchain-text-splitters>=0.2",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
# An extra, not a dependency: pymupdf4llm and PyMuPDF are AGPL-3.0, and chunklab is MIT.
pdf = ["pymupdf4llm>=0.0.17"]
# ruff is pinned to a minor range: `ruff format` is a CI gate, and a new release
# that formats something differently (0.16 began formatting Python blocks inside
# markdown) turns every unrelated PR red until someone reformats.
# gradio is a dev dependency, not just a demo extra: `chunklab demo` is advertised
# in the README, so CI has to actually build the interface.
# build is pinned to the range release.yml builds with, so a local sdist or wheel is the
# artifact CI would make.
# pymupdf4llm is here for the reason gradio is: the suite reads a real PDF, so CI
# exercises the extra that users install.
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "pre-commit>=3.5",
    "gradio>=4.0",
    "build>=1.6,<2",
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
chunklab = "chunklab.cli:app"

[project.urls]
Homepage = "https://ludovico-chieffallo.github.io/chunklab/"
Documentation = "https://ludovico-chieffallo.github.io/chunklab/"
Repository = "https://github.com/Ludovico-Chieffallo/chunklab"
Issues = "https://github.com/Ludovico-Chieffallo/chunklab/issues"
Changelog = "https://github.com/Ludovico-Chieffallo/chunklab/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["chunklab"]

# An explicit list, not hatchling's default of "everything this repository's
# .gitignore does not exclude": a file kept out of git by any other rule - a global
# excludes file, local editor or assistant settings - otherwise lands in an sdist
# built from a working tree, and PyPI does not let you take a file back.
[tool.hatch.build.targets.sdist]
only-include = [
    "chunklab",
    "tests",
    "examples",
    "docs",
    "scripts",
    "app",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "mkdocs.yml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"chunklab/cli.py" = ["B008"]          # typer.Option in defaults is the Typer idiom
"chunklab/report/html.py" = ["E501"]  # long lines inside the inline HTML template

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests that download the real embedding model"]
addopts = "-m 'not slow'"
